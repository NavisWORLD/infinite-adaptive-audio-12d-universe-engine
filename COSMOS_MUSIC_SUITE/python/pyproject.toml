[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-music"
version = "1.1.0"
description = "Python companion engine for COSMOS Music bio-adaptive instruments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Cory Davis Audio / Neural Instrument Research Source Rights Reservation v1.0 - see ../LICENSE and ../LICENSE_HISTORY.md"}
authors = [{name = "Cory Shane Davis"}]
keywords = ["music", "audio", "biofeedback", "CST", "COSMOS", "12D"]
classifiers = ["Programming Language :: Python :: 3"]

[project.scripts]
cosmos-music = "cosmos_music.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
