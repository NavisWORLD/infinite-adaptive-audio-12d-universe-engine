name: COSMOS Music Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['cosmos-music-v*']
    paths:
      - 'COSMOS_MUSIC_SUITE/**'
      - '.github/workflows/cosmos-music-android-apk.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: COSMOS_MUSIC_SUITE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '21'}
      - run: npm install
      - run: npm run native:android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: COSMOS-Music-Android-debug-apk
          path: COSMOS_MUSIC_SUITE/android/app/build/outputs/apk/debug/app-debug.apk
