name: COSMOS Music Build Android APK (Manual)

# Production Android binaries are built by cosmos-music-release.yml.
# Keep this smaller workflow as an explicit manual fallback for maintainers.
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: COSMOS_MUSIC_SUITE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install
      - run: npm run native:android
      - name: Build community debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: COSMOS-Music-Android-debug-apk
          path: COSMOS_MUSIC_SUITE/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
